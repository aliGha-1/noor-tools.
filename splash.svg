<svg xmlns="http://www.w3.org/2000/svg"
     width="1080"
     height="1920"
     viewBox="0 0 1080 1920">

  <defs>
    <linearGradient id="background"
                    x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#071321"/>
      <stop offset="55%" stop-color="#102438"/>
      <stop offset="100%" stop-color="#050B13"/>
    </linearGradient>

    <linearGradient id="metal"
                    x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="45%" stop-color="#C7D2DE"/>
      <stop offset="100%" stop-color="#77899B"/>
    </linearGradient>

    <linearGradient id="green"
                    x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#65FFC0"/>
      <stop offset="50%" stop-color="#19D58A"/>
      <stop offset="100%" stop-color="#08784D"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="12"
                      result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1080" height="1920"
        fill="url(#background)"/>

  <circle cx="540" cy="700" r="370"
          fill="#19D58A" opacity="0.045"/>

  <circle cx="540" cy="700" r="285"
          fill="none"
          stroke="#19D58A"
          stroke-width="2"
          opacity="0.35"/>

  <circle cx="540" cy="700" r="255"
          fill="none"
          stroke="#C7D2DE"
          stroke-width="1.5"
          opacity="0.2"/>

  <rect x="330" y="490" width="420" height="420"
        rx="92"
        fill="#0B1928"
        stroke="url(#green)"
        stroke-width="7"/>

  <path d="M420 810 V590 L660 810 V590"
        fill="none"
        stroke="url(#metal)"
        stroke-width="48"
        stroke-linecap="square"
        stroke-linejoin="round"
        filter="url(#glow)"/>

  <path d="M420 810 V590 L660 810 V590"
        fill="none"
        stroke="url(#green)"
        stroke-width="10"
        stroke-linecap="square"
        stroke-linejoin="round"/>

  <text x="540" y="1040"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="76"
        font-weight="bold"
        letter-spacing="7"
        fill="url(#metal)">NOOR TOOLS</text>

  <path d="M300 1090 H780"
        stroke="url(#green)"
        stroke-width="5"
        stroke-linecap="round"/>

  <text x="540" y="1170"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="42"
        fill="#19D58A">نور تولز</text>

  <text x="540" y="1240"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="29"
        fill="#C7D2DE">إدارة ذكية للمخزون والفواتير</text>

  <text x="540" y="1660"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="31"
        fill="#C7D2DE">تصميم وتطوير: م. علي غريب</text>

  <text x="540" y="1715"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="28"
        fill="#19D58A">01559330658</text>

</svg>
